<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;background:#101b23;color:#f5f1e8;font:16px system-ui,Arial;padding:20px}main{max-width:460px;margin:auto}h1{font-size:23px}label{display:block;margin:14px 0 6px}select,input,button{width:100%;padding:13px;border-radius:9px;font:inherit}select,input{background:#223742;color:white;border:1px solid #77909b}button{background:#d5b16c;color:#17222b;border:0;font-weight:700;margin-top:18px}button:disabled{opacity:.5}#estado{padding:15px;background:#253b45;border-radius:12px;line-height:1.6}#mensaje{margin-top:16px;white-space:pre-wrap}small{color:#cad3d3}code{color:#ffdf9e}</style></head><body><main><h1>♟ Ajedrez Familiar · Prueba de jugada</h1><p><small>Interfaz de prueba segura alojada en Google Apps Script. El tablero 3D de GitHub sigue en solo lectura.</small></p><div id="estado">Consultando partida…</div><form id="form"><label>Jugador</label><select id="jugador"><option value="2">Sobrina · blancas</option><option value="1">Óscar · negras</option></select><label>PIN</label><input id="pin" type="password" inputmode="numeric" pattern="[0-9]{4,12}" maxlength="12" autocomplete="off" required><label>Desde</label><input id="desde" value="g1" maxlength="2" required><label>Hasta</label><input id="hasta" value="f3" maxlength="2" required><label>Promoción (opcional: q, r, b, n)</label><input id="promocion" maxlength="1"><button id="enviar" disabled>Registrar jugada</button></form><div id="mensaje" role="status"></div></main><script>
let version=null;const $=id=>document.getElementById(id);
function cargar(){google.script.run.withSuccessHandler(d=>{version=d.version;$('estado').textContent='Versión '+d.version+' · Turno: '+(d.turno==='w'?'Sobrina (blancas)':'Óscar (negras)')+' · '+d.estado+' · FEN: '+d.fen;$('enviar').disabled=d.estado.toLowerCase()!=='activa';}).withFailureHandler(e=>{$('estado').textContent='Error: '+e.message;$('enviar').disabled=true}).af34_estado()}
$('form').onsubmit=e=>{e.preventDefault();if(version===null)return;const solicitud={jugadorId:Number($('jugador').value),pin:$('pin').value,desde:$('desde').value.trim().toLowerCase(),hasta:$('hasta').value.trim().toLowerCase(),promocion:$('promocion').value.trim().toLowerCase(),version};$('enviar').disabled=true;$('mensaje').textContent='Validando y registrando…';$('pin').value='';google.script.run.withSuccessHandler(r=>{$('mensaje').textContent='✓ Jugada registrada. Versión '+r.version;$('enviar').disabled=false;cargar()}).withFailureHandler(err=>{$('mensaje').textContent='⚠ '+err.message+'\nComprueba el estado antes de reintentar.';cargar()}).af34_jugar(solicitud)};cargar();
</script></body></html>
